modLoader = "javafml"
loaderVersion = "[4,)"
license = "MIT"

[[mods]]
modId = "${mod_id}"
version = "${mod_version}"
displayName = "${mod_name}"
authors = "Antarchy Craft"
description = '''Fixes for mods in the Antarchy Craft modpack. Contains only our own code.

- Antarchy: the King's Tree no longer freezes the server while it generates.
- Distant Horizons: worlds no longer crash on load when Chunky is installed.'''

[[mixins]]
config = "antarchycraftfixes.mixins.json"

[[mixins]]
config = "antarchycraftfixes.distanthorizons.mixins.json"

[[dependencies.${mod_id}]]
modId = "neoforge"
type = "required"
versionRange = "[21.1,)"
ordering = "NONE"
side = "BOTH"

# Pinned to the Antarchy build these mixins were written and tested against. A newer Antarchy
# refuses to load with this mod, so the fix gets checked again instead of silently misapplying.
[[dependencies.${mod_id}]]
modId = "antarchy"
type = "required"
versionRange = "[2.1.1,2.1.2)"
ordering = "AFTER"
side = "BOTH"

# Optional: only checked when Distant Horizons is installed. Pinned to 3.3.x for the same reason.
[[dependencies.${mod_id}]]
modId = "distanthorizons"
type = "optional"
versionRange = "[3.3.3,3.4)"
ordering = "AFTER"
side = "BOTH"
