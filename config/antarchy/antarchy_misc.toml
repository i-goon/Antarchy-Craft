[elythia]
	#Whether firefly ambient particles appear at night in the Elythia dimension.
	fireflyParticlesEnabled = true

[dreamSand]
	#If true, jumping from dream sand applies temporary low gravity until solid ground is touched.
	enabled = true
	#Multiplier applied to upward jump velocity when leaving dream sand.
	# Default: 1.3
	# Range: 0.0 ~ 16.0
	jumpVelocityMultiplier = 1.3
	#Multiplier applied to downward velocity while low gravity is active.
	# Default: 0.45
	# Range: 0.0 ~ 1.0
	gravityMultiplier = 0.45
	#Seconds the low-gravity effect remains active after leaving dream sand.
	# Default: 7.0
	# Range: 0.0 ~ 60.0
	effectDurationSeconds = 7.0
	#Multiplier applied to fall damage after dream sand low gravity.
	# Default: 0.4
	# Range: 0.0 ~ 16.0
	fallDamageMultiplier = 0.4

[ichor]
	#If true, players submerged in ichor receive a Wither effect.
	witherEnabled = true

[hushweed]
	#How long (in seconds) a Hushweed spore projectile stays alive before disappearing.
	# Default: 5.0
	# Range: 0.1 ~ 120.0
	sporeLifetimeSeconds = 5.0

[infinityDimensions]
	#If true, book and quills cannot be thrown into nether portals to create random dimensions.
	disableInfinityBookPortalCreation = true
	#Whether rainbow ants open randomly generated Infinity dimensions.
	#Only works if the Infinite Dimensions mod is installed.
	rainbowAntsLeadToInfinityDimensions = true
	#Chance for a rainbow ant Infinity destination roll to select an Infinity easter egg dimension instead of a normal generated one.
	#0.01 = 1%, 0 disables easter egg rolls.
	# Default: 0.01
	# Range: 0.0 ~ 1.0
	rainbowAntInfinityEasterEggChance = 0.01

[permanentPortals]
	#Master toggle for sacrifice-activated permanent portals.
	permanentPortalsEnabled = true
	#Whether flint and steel can ignite permanent portal frames.
	permanentPortalsFlintAndSteelEnabled = false
	#Whether mossy ouranwood wood portals to Elythia can activate and function.
	elythiaPortalEnabled = true
	#Whether Nyxite portals to Thoraxis can activate and function.
	thoraxisPortalEnabled = true
	#Whether Myrmite portals to Cavaryn can activate and function.
	cavarynPortalEnabled = true

[diamondMinecart]
	#Master toggle. If false, acts like a regular minecart.
	enabled = true
	#Whether the cart automatically places rails from the rider's inventory.
	placesRails = true
	#Cruise speed in blocks/tick while ridden (even without holding W).
	# Default: 0.6
	# Range: 0.05 ~ 2.0
	cruiseSpeed = 0.6
	#Maximum boosted speed in blocks/tick when W is held. Vanilla cap is 0.4.
	# Default: 1.0
	# Range: 0.05 ~ 2.0
	maxSpeed = 1.0
	#Speed gained per tick while accelerating.
	# Default: 0.03
	# Range: 0.001 ~ 0.5
	acceleration = 0.03
	#Speed lost per tick while S is held (active braking).
	# Default: 0.04
	# Range: 0.001 ~ 0.5
	deceleration = 0.04
	#Speed lost per tick when neither W nor S is held (coasting friction).
	# Default: 0.01
	# Range: 0.001 ~ 0.5
	coastDeceleration = 0.01
	#Whether the cart deals damage to mobs it collides with at speed.
	mobDamageEnabled = true
	#Maximum damage dealt at full speed. Scales linearly with current speed.
	# Default: 8.0
	# Range: 0.0 ~ 200.0
	maxMobDamage = 8.0

[world]
	#If false, duplicator trees do not generate and duplicator saplings produce nothing.
	duplicatorTreeEnabled = true
	#Whether glow vines can be placed and survive when attached under leaf blocks.
	glowVinesUnderLeaves = true
	#If true, torchflowers use the glowing behavior.
	glowingTorchflowers = true
	#If true, empty collision plants like grass do not block melee target picking.
	swingThroughGrassEnabled = true
	fabricKeybindingConflictFixEnabled = true
	experimentalSettingsPopupDisabled = true
	#If true, burning entities use soul fire / dream fire overlays where appropriate.
	entitySpecificFireOverlayEnabled = true
