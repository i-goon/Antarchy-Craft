#Enable Voxy LOD rendering system
enabled = true
#Enable LOD terrain rendering (can be disabled while keeping data ingestion)
enableRendering = true
#Enable automatic chunk data ingestion for LOD generation
ingestEnabled = true
#LOD section render distance (multiplied by 32 for actual chunk distance)
#Example: 16 = 512 chunks render distance
# Default: 16 (pack default: 4 = 128 chunks for performance)
# Range: 2 ~ 64
sectionRenderDistance = 4
#Number of background threads for LOD processing
#Default is based on CPU core count.
# Default: 4
# Range: 1 ~ 6
serviceThreads = 4
#Subdivision size for LOD rendering (28-256)
#Lower = more detailed LODs but more GPU load
# Default: 64.0
# Range: 28.0 ~ 256.0
subDivisionSize = 64.0
#Apply environmental fog to LOD terrain
useEnvironmentalFog = true
#Don't share threads with Sodium's chunk builder
dontUseSodiumBuilderThreads = false
#Extra inward shrink of each vanilla chunk's LOD-occlusion box, in blocks.
#Leave at 0: the outermost-ring cull + exact occlusion alignment already handle the
#vanilla<->LOD boundary, so any overlap (>0) just makes flat water z-fight at the seam.
# Default: 0
# Range: 0 ~ 4
lodBoundaryBuffer = 1
#World curvature effect - simulates standing on a spherical planet
#0 = disabled (flat world)
#1 = real Earth curvature (6371km radius)
#Higher values = more extreme curvature (smaller planet effect)
#Valid range: 0 (off), or 50-5000. Values 1-49 are auto-corrected to 50.
#Inspired by Distant Horizons' earth curvature feature
# Default: 0
# Range: 0 ~ 5000
earthCurveRatio = 0
#Show render statistics in F3 debug screen
#Displays LOD traversal counts, visible sections, and quad counts
renderStatistics = false
#Width of the screen-centred, full-height column that keeps rendering vanilla chunks,
#as a percentage of the MONITOR width. Everything to the left/right of it renders as LOD.
#100 = off (column at least as wide as the window). Lower turns the side wings into LOD
#(useful on ultrawide). Range: 30-100.
# Default: 100
# Range: 30 ~ 100
lodCenterWidthPct = 100
#Background-generate chunks beyond the vanilla render distance (singleplayer/LAN host)
#and feed them into the LOD store. Generates in expanding rings around the player,
#only to the LIGHT chunk status (no entities/ticking), throttled by server load.
distantGenEnabled = true
#Distant generation radius in chunks around the player (96 = 1536 blocks)
# Default: 96
# Range: 16 ~ 1024
distantGenRadius = 96
#How many chunks may generate concurrently. Higher = faster but more server load.
# Default: 16
# Range: 1 ~ 128
distantGenMaxInFlight = 16
#Only start new distant chunks while the server's average tick time (MSPT) is below this
# Default: 45
# Range: 10 ~ 50
distantGenMaxMspt = 45
