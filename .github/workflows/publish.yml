name: Publish

on:
  workflow_dispatch:  # manual trigger
  push:
    tags:
      - "v*"           # auto-publish on version tags

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Install packwiz
        run: go install github.com/packwiz/packwiz@latest

      - name: Export .mrpack (Modrinth)
        run: packwiz modrinth export

      - name: Export .zip (CurseForge)
        run: packwiz curseforge export

      - name: Resolve changelog
        id: changelog
        run: |
          set -e
          TAG="${GITHUB_REF#refs/tags/}"
          OUT="/tmp/changelog.md"
          # Prefer section for TAG from CHANGELOG.md if present
          if [ -f CHANGELOG.md ] && grep -q "## \[${TAG#v}" CHANGELOG.md; then
            echo "Using CHANGELOG.md section for $TAG"
            awk -v tag="${TAG#v}" '
              $0 ~ "^## \\["tag"\\]" {p=1; next}
              p && /^## \[/ {exit}
              p {print}
            ' CHANGELOG.md > "$OUT"
            # fallback if awk produced empty
            if [ ! -s "$OUT" ]; then
              git log "$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo HEAD~1)..HEAD" --pretty=format:'- %s' > "$OUT" || echo "- $TAG" > "$OUT"
            fi
          else
            echo "CHANGELOG.md missing section for $TAG — falling back to git log"
            if git describe --tags --abbrev=0 HEAD^ >/dev/null 2>&1; then
              PREV="$(git describe --tags --abbrev=0 HEAD^)"
              git log "$PREV..HEAD" --pretty=format:'- %s' > "$OUT"
            else
              git log --pretty=format:'- %s' -10 > "$OUT"
            fi
            [ -s "$OUT" ] || echo "- $TAG" > "$OUT"
          fi
          echo "--- changelog preview ---"
          cat "$OUT"
          echo "changelog-file=$OUT" >> "$GITHUB_OUTPUT"

      - name: Publish to Modrinth
        uses: Kir-Antipov/mc-publish@v3
        with:
          modrinth-id: EHj9agqR
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: |
            *.mrpack
          loaders: neoforge
          game-versions: "1.21.1"
          changelog-file: ${{ steps.changelog.outputs.changelog-file }}

      - name: Publish to CurseForge
        uses: Kir-Antipov/mc-publish@v3
        with:
          curseforge-id: 1653892
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: |
            *.zip
          loaders: neoforge
          game-versions: "1.21.1"
          changelog-file: ${{ steps.changelog.outputs.changelog-file }}
