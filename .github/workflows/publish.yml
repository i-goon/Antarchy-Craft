name: Publish

on:
  workflow_dispatch:  # manual trigger
  push:
    tags:
      - "v*"           # auto-publish on version tags

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"

      - name: Install packwiz
        run: go install github.com/packwiz/packwiz@latest

      - name: Export .mrpack (Modrinth)
        run: packwiz modrinth export

      - name: Export .zip (CurseForge)
        run: packwiz curseforge export

      - name: Publish to Modrinth
        uses: Kir-Antipov/mc-publish@v3
        with:
          modrinth-id: EHj9agqR
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: |
            *.mrpack
          loaders: neoforge
          game-versions: "1.21.1"
          changelog: "See commits for changes"

      - name: Publish to CurseForge
        uses: Kir-Antipov/mc-publish@v3
        with:
          curseforge-id: 1653892
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          files: |
            *.zip
          loaders: neoforge
          game-versions: "1.21.1"
          changelog: "See commits for changes"
